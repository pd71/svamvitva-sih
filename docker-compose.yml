version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploaded_images:/app/uploaded_images
      - ./backend/svamitva_drone.db:/app/svamitva_drone.db
    environment:
      - DATABASE_URL=sqlite:///./svamitva_drone.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
